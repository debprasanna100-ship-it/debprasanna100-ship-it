      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan-light" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.08">
        <animate attributeName="stop-opacity" values="0.05;0.11;0.05" dur="10s" repeatCount="indefinite" />
