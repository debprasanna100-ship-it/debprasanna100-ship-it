<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Debprasanna Bag — Engineering Student Profile</title>
  <desc id="desc">A dark terminal-inspired profile banner highlighting engineering studies, machine learning, embedded systems, and software projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset=".55" stop-color="#0b1224"/><stop offset="1" stop-color="#071b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
      <animate attributeName="x1" values="0;0.2;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17243a" stop-opacity=".88"/><stop offset="1" stop-color="#0b1426" stop-opacity=".78"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7dd3fc" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 5.5H4" stroke="#c4f1ff" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="12" y="12" width="1156" height="586" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect x="12" y="12" width="1156" height="586" rx="22" fill="url(#bg)"/>
    <rect x="12" y="12" width="1156" height="586" fill="url(#grid)"/>
    <ellipse cx="210" cy="260" rx="300" ry="290" fill="url(#glow)"/>
    <ellipse cx="1000" cy="440" rx="330" ry="260" fill="url(#glow)"/>
    <rect x="12" y="12" width="1156" height="586" fill="url(#scan)"/>
    <rect x="12.5" y="12.5" width="1155" height="585" rx="22" fill="none" stroke="#5eead4" stroke-opacity=".45"/>
    <path d="M34 13H360" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values=".55;1;.55" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- top chrome -->
    <rect x="28" y="28" width="1124" height="42" rx="10" fill="#07101e" fill-opacity=".85" stroke="#334155" stroke-opacity=".7"/>
    <circle cx="49" cy="49" r="5" fill="#fb7185"/><circle cx="67" cy="49" r="5" fill="#fbbf24"/><circle cx="85" cy="49" r="5" fill="#34d399"/>
    <text x="108" y="53" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">debprasanna@profile:~</text>
    <text x="1098" y="53" text-anchor="end" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">● PROFILE ONLINE</text>
    <!-- left visual map -->
    <rect x="30" y="86" width="420" height="486" rx="16" fill="url(#panel)" stroke="#64748b" stroke-opacity=".42" filter="url(#shadow)"/>
    <text x="54" y="116" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">VISUAL.MAP</text>
    <text x="425" y="116" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">[ 01 / IDENTITY ]</text>
    <path d="M54 130H426" stroke="#334155" stroke-opacity=".8"/>
    <!-- abstract terminal glyph portrait; intentionally not a real likeness -->
    <rect x="74" y="151" width="332" height="246" rx="12" fill="#07101c" fill-opacity=".75" stroke="#334155"/>
    <circle cx="240" cy="270" r="100" fill="url(#glow)"/>
    <g fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
      <text x="240" y="193" font-size="12" opacity=".45">. : + * # % @ # * + : .</text>
      <text x="240" y="211" font-size="13" opacity=".62">: + * # % @ % # * + :</text>
      <text x="240" y="229" font-size="14" opacity=".72">+ * # % @ @ @ % # * +</text>
      <text x="240" y="247" font-size="15" opacity=".82">* # % @  { }  @ % # *</text>
      <text x="240" y="265" font-size="16" opacity=".95"># % @  &lt; / &gt;  @ % #</text>
      <text x="240" y="283" font-size="16" opacity=".95"># % @  [ _ ]  @ % #</text>
      <text x="240" y="301" font-size="15" opacity=".82">+ * # % @ @ @ % # * +</text>
      <text x="240" y="319" font-size="14" opacity=".72">: + * # % @ % # * + :</text>
      <text x="240" y="337" font-size="13" opacity=".62">. : + * # % % # * + : .</text>
      <text x="240" y="355" font-size="12" opacity=".45">- - - - - - - - - - - -</text>
      <animate attributeName="opacity" values=".82;1;.82" dur="6s" repeatCount="indefinite"/>
    </g>
    <path d="M90 374H390" stroke="url(#accent)" stroke-width="1" stroke-opacity=".8"/>
    <text x="240" y="388" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.4">GLYPH FIELD // ABSTRACT, NOT A PHOTO</text>
    <text x="54" y="430" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">Engineering student</text>
    <text x="54" y="452" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Curious by design. Building step by step.</text>
    <rect x="54" y="475" width="372" height="1" fill="#334155"/>
    <text x="54" y="503" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">~/profile $</text>
    <text x="143" y="503" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">learn --build --repeat</text>
    <rect x="54" y="519" width="8" height="14" fill="#67e8f9">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="75" y="531" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">STATUS: EXPLORING</text>
    <!-- right system info -->
    <rect x="468" y="86" width="682" height="486" rx="16" fill="url(#panel)" stroke="#64748b" stroke-opacity=".42" filter="url(#shadow)"/>
    <text x="494" y="116" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2">SYSTEM.INFO</text>
    <text x="1124" y="116" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">PROFILE.SYS</text>
    <path d="M492 130H1126" stroke="#334155" stroke-opacity=".8"/>
    <text x="494" y="163" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">$ ./profile.sh --summary</text>
    <text x="494" y="203" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" font-weight="700">Debprasanna Bag</text>
    <text x="494" y="229" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Engineering Student · Tech Enthusiast</text>
    <path d="M494 247H1124" stroke="#334155"/>
    <text x="494" y="274" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">CORE FOCUS</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <rect x="494" y="288" width="168" height="31" rx="8" fill="#0e7490" fill-opacity=".18" stroke="#22d3ee" stroke-opacity=".5"/>
      <text x="578" y="308" text-anchor="middle" fill="#a5f3fc">Machine Learning</text>
      <rect x="674" y="288" width="168" height="31" rx="8" fill="#7c3aed" fill-opacity=".15" stroke="#a78bfa" stroke-opacity=".55"/>
      <text x="758" y="308" text-anchor="middle" fill="#ddd6fe">Embedded Systems</text>
      <rect x="854" y="288" width="172" height="31" rx="8" fill="#047857" fill-opacity=".16" stroke="#34d399" stroke-opacity=".5"/>
      <text x="940" y="308" text-anchor="middle" fill="#a7f3d0">Software Projects</text>
    </g>
    <text x="494" y="354" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">CURRENT BUILDS / INTERESTS</text>
    <circle cx="501" cy="378" r="3" fill="#34d399"/>
    <text x="515" y="382" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">RP2040 quadcopter flight-controller exploration</text>
    <circle cx="501" cy="404" r="3" fill="#22d3ee"/>
    <text x="515" y="408" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Campus-inspired browser game</text>
    <path d="M494 429H1126" stroke="#334155"/>
    <text x="494" y="454" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">CONNECT</text>
    <a href="https://www.linkedin.com/in/debprasanna-bag-a69b13417/" target="_blank">
      <rect x="494" y="468" width="145" height="35" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="566" y="490" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">↗ LinkedIn</text>
    </a>
    <text x="494" y="536" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">LEARNING IN PUBLIC · ITERATING WITH INTENT</text>
    <path d="M1065 552h60" stroke="url(#accent)" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
