<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Debprasanna Bag — AI and ML Engineer, Medical AI and Computer Vision Researcher, and Robotics Enthusiast">
  <defs>
    <!-- Light Theme Background Gradients -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
