<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Debprasanna Bag - AI and ML Engineer">
  <defs>
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>
    <radialGradient id="glow-violet" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.14;0.24;0.14" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-cyan" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.12;0.22;0.12" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.68" />
    </linearGradient>
    <linearGradient id="ascii-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#22D3EE" />
      <stop offset="85%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.25" />
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="1" stroke-opacity="0.22" />
    </pattern>
    <clipPath id="outer-clip">
      <rect x="8" y="8" width="1164" height="594" rx="22" />
    </clipPath>
    <clipPath id="portrait-clip">
      <rect x="52" y="132" width="388" height="268" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#outer-clip)">
    <rect x="8" y="8" width="1164" height="594" rx="22" fill="url(#bg-base)" />
    <rect x="8" y="8" width="1164" height="594" fill="url(#glow-violet)" />
    <rect x="8" y="8" width="1164" height="594" fill="url(#glow-cyan)" />
    <rect x="8" y="8" width="1164" height="594" fill="url(#grid)" />

    <circle cx="180" cy="110" r="1.5" fill="#22D3EE" opacity="0.4">
      <animate attributeName="cy" values="110;95;110" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="140" r="2" fill="#7C3AED" opacity="0.35">
      <animate attributeName="cy" values="140;160;140" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="540" r="1.5" fill="#10B981" opacity="0.35">
      <animate attributeName="cy" values="540;522;540" dur="7s" repeatCount="indefinite" />
    </circle>

    <rect x="8" y="8" width="1164" height="52" fill="#090F1D" fill-opacity="0.88" />
    <line x1="8" y1="60" x2="1172" y2="60" stroke="#1E293B" stroke-width="1" />

    <circle cx="38" cy="34" r="6.5" fill="#EF4444" />
    <circle cx="60" cy="34" r="6.5" fill="#F59E0B" />
    <circle cx="82" cy="34" r="6.5" fill="#10B981" />

    <text x="116" y="39" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#94A3B8" letter-spacing="0.5">debprasanna@engineering:~</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748B">
      <text x="540" y="38" fill="#22D3EE">01.IDENTITY</text>
      <text x="645" y="38">02.FOCUS</text>
      <text x="730" y="38">03.STACK</text>
      <text x="815" y="38">04.PROJECTS</text>
    </g>

    <rect x="1044" y="21" width="104" height="26" rx="13" fill="#064E3B" fill-opacity="0.45" stroke="#10B981" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="1062" cy="34" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="1074" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="bold" fill="#34D399" letter-spacing="1">ONLINE</text>

    <!-- LEFT COLUMN -->
    <g opacity="0">
      
