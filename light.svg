<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Debprasanna Bag — Engineering Student Profile</title>
  <desc id="desc">A light terminal-inspired profile banner highlighting engineering studies, machine learning, embedded systems, and software projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".58" stop-color="#f3f8ff"/><stop offset="1" stop-color="#e9f8fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/><stop offset=".52" stop-color="#0891b2"/><stop offset="1" stop-color="#059669"/>
      <animate attributeName="x1" values="0;0.2;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#f8fbff" stop-opacity=".94"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".14"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
